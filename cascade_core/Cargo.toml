[package]
name = "cascade_core"
version = "0.1.0"
edition = "2021"

[dependencies]
petgraph = "0.6.4"
log = "0.4.20"

tokio = { version = "1.39.3", features = ["time", "sync"] }
tokio-util = { version = "0.7.12", features = ["default"] }
async-trait = "0.1.73"
async-channel = "1.9.0"

futures = "0.3.30"
futures-core = "0.3.30"
futures-util = "0.3.30"

serde = { version = "1.0.188", features = ["derive"] }
serde_json = "1.0.107"

cascade_api = { path = "../cascade_api" }
